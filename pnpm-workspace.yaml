packages:
  - "apps/*"
  - "examples/*"
  - "libraries/*"
  - "templates/*"
  - "tools/*"

minimumReleaseAge: 1440
# strict mode breaks Dependabot's `pnpm update --no-save`; remove once dependabot/dependabot-core#16375 is fixed
minimumReleaseAgeStrict: false
# excluding a whole dependency disables minimumReleaseAge for all future versions; prefer pinning a specific version via overrides
# clean up entries here once they're no longer needed
minimumReleaseAgeExclude: []
blockExoticSubdeps: true

overrides:
  "@babel/core@7.26.10": "~7.29.7"
  "@babel/helpers@7.26.10": "~7.29.7"
  "@babel/runtime@7.26.10": "~7.29.7"
  "@hono/node-server@1.19.9": "~2.1.3"
  "@modelcontextprotocol/sdk@1.17.2": "~1.32.2"
  "body-parser@2.2.2": "~2.4.0"
  "brace-expansion@1.1.12": "~1.1.21"
  "brace-expansion@1.1.18": "~1.1.21"
  "brace-expansion@2.1.4": "~2.1.7"
  "brace-expansion@5.0.9": "~5.0.12"
  "joi@17.13.8": "~17.13.9"
  "joi@18.2.9": "~18.3.1"
  "jsonwebtoken@9.0.2": "9.0.3"
  "launch-editor@2.14.1": "~2.14.2"
  "lodash@4.17.21": "~4.18.0"
  "markdown-it@14.1.1": "~14.3.3"
  "path-to-regexp@8.3.0": "~8.4.0"
  "postcss@5.2.18": "~8.5.28"
  "proxy-addr@2.0.7": "~2.0.8"
  "qs@6.14.2": "~6.16.0"
  "shell-quote@1.10.0": "~1.12.0"
  "shell-quote@1.9.0": "~1.12.0"
  "tar-fs@2.1.3": "~2.1.4"
  "tsx@4.21.1": "~4.23.13"
  "uuid@8.3.2": "~11.1.1"
  "vite@6.2.7": "~6.4.4"
  "vite@6.4.3": "~6.4.4"
  "webpack@5.97.1": "~5.104.1"
  "yaml@2.7.1": "~2.8.3"
  "yaml@2.8.2": "~2.8.3"

allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  better-sqlite3: true
  esbuild: true
  oxc-resolver: true
  sharp: true
  unrs-resolver: true
  browser-tabs-lock: false
