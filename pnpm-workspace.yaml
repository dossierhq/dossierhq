packages:
  - "apps/*"
  - "examples/*"
  - "libraries/*"
  - "templates/*"
  - "tools/*"

minimumReleaseAge: 1440
# excluding a whole dependency disables minimumReleaseAge for all future versions; prefer pinning a specific version via overrides
# clean up entries here once they're no longer needed
minimumReleaseAgeExclude: []
blockExoticSubdeps: true

overrides:
  "@babel/core@7.26.10": "~7.29.7"
  "@babel/helpers@7.26.10": "~7.29.7"
  "@babel/runtime@7.26.10": "~7.29.7"
  "@hono/node-server@1.19.9": "~1.19.13"
  "@modelcontextprotocol/sdk@1.17.2": "~1.26.0"
  "body-parser@2.2.2": "~2.3.0"
  "brace-expansion@1.1.12": "~1.1.13"
  "jsonwebtoken@9.0.2": "9.0.3"
  "lodash@4.17.21": "~4.18.0"
  "markdown-it@14.1.1": "~14.3.2"
  "path-to-regexp@8.3.0": "~8.4.0"
  "postcss@5.2.18": "~8.5.28"
  "qs@6.14.2": "~6.16.0"
  "tar-fs@2.1.3": "~2.1.4"
  "tsx@4.21.1": "~4.23.13"
  "uuid@8.3.2": "~11.1.1"
  "vite@6.2.7": "~6.4.1"
  "webpack@5.97.1": "~5.104.1"
  "yaml@2.7.1": "~2.8.3"
  "yaml@2.8.2": "~2.8.3"

allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  better-sqlite3: true
  esbuild: true
  oxc-resolver: true
  sharp: true
  unrs-resolver: true
  browser-tabs-lock: false
