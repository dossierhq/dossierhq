name: Browser Integration Tests
on: [push]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    name: Browser integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: apt-get update
        run: sudo apt-get update # to avoid error when installing Playwright
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        # Run the binary from node_modules directly so the version pinned in
        # pnpm-lock.yaml is used. `npx playwright` fetched its own copy instead,
        # which downloaded a mismatched browser build and hung until the job
        # timed out. This downloads browsers, it doesn't install packages.
        run: |
          cd libraries/sql.js-browser-integration-test
          ./node_modules/.bin/playwright install --with-deps chromium firefox webkit
          cd ../react-components2
          ./node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: build
        run: |
          npx turbo run --filter=@dossierhq/sql.js-browser-integration-test --filter=@dossierhq/react-components2 lint check-types build test test-integration
        env:
          TURBO_TEAM: ${{ secrets.DOSSIERHQ_TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.DOSSIERHQ_TURBO_TOKEN }}
      - name: Run Chromatic for react-components2
        uses: chromaui/action@14cfaef73576e69f95f47f60058063f46ca38719 # v18.1.0
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: libraries/react-components2
      - name: Serve Storybook and run tests
        run: |
          cd libraries/react-components2
          npm run build-storybook
          npx concurrently -k -s first -n "SB,TEST" -c "magenta,blue" \
            "npx http-server storybook-static --port 6008 --silent" \
            "npx wait-on tcp:6008 && npm run test:storybook"
