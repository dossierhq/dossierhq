name: Node CI
on: [push]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache blog/next-web next
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/blog/.next/cache/
            examples/next-web/.next/cache/
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: start db
        run: |
          cd tools/generic-tools/
          npm run db:start &
          npm run db:wait
      - name: setup db
        run: |
          cd tools/generic-tools/
          npm run db:ensure-dbs
          npm run db:make-users:superuser
          npm run db:migrate:all
          npm run db:make-users:no-superuser
      - name: build
        run: |
          npx turbo run --filter=@dossierhq/libsql lint check-types build test test-integration
          env CI_SKIP_BROWSER_TEST=true pnpm build
        env:
          TURBO_TEAM: ${{ secrets.DOSSIERHQ_TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.DOSSIERHQ_TURBO_TOKEN }}
      - name: upload sqld logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sqld-logs
          path: libraries/libsql/databases/sqld-*/log.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: knip
        run: npm run knip || true
      - name: check for uncommitted changes after build
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Build produced uncommitted changes. Regenerate locally and commit:"
            git status --short
            echo "--- diff ---"
            git diff
            exit 1
          fi
      - name: stop db
        run: |
          cd tools/generic-tools/
          npm run db:stop
